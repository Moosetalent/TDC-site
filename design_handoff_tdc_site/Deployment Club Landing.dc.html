<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Archivo', Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.6; }
  ::selection { background: #f5821e; color: #fff; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <nav style="display: flex; align-items: center; justify-content: space-between; padding: 8px 40px; position: sticky; top: 0; background: #000; z-index: 10; color: #fff">
    <a href="#" style="display: flex; align-items: center"><img src="assets/logo-dark.png" alt="TDC — The Deployment Club" style="height: 64px; display: block"></a>
    <div style="display: flex; gap: 10px; font-size: 14px; font-weight: 500">
      <a href="Manifesto.dc.html" style="padding: 9px 20px; border-radius: 999px; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.12)); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), inset 0 10px 18px -12px rgba(255,255,255,0.3), inset 0 -10px 16px -10px rgba(0,0,0,0.5), 0 10px 30px -12px rgba(0,0,0,0.6); transition: all 0.35s cubic-bezier(0.2, 1.4, 0.3, 1)" style-hover="background: linear-gradient(160deg, rgba(255,255,255,0.3), rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.2)); border-color: rgba(255,255,255,0.5); transform: translateY(-2px) scale(1.04); opacity: 1" style-active="transform: translateY(0) scale(0.98)">Manifesto</a>
      <a href="#club" style="padding: 9px 20px; border-radius: 999px; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.12)); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), inset 0 10px 18px -12px rgba(255,255,255,0.3), inset 0 -10px 16px -10px rgba(0,0,0,0.5), 0 10px 30px -12px rgba(0,0,0,0.6); transition: all 0.35s cubic-bezier(0.2, 1.4, 0.3, 1)" style-hover="background: linear-gradient(160deg, rgba(255,255,255,0.3), rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.2)); border-color: rgba(255,255,255,0.5); transform: translateY(-2px) scale(1.04); opacity: 1" style-active="transform: translateY(0) scale(0.98)">The Club</a>
      <a href="Join the Club.dc.html" style="padding: 9px 20px; border-radius: 999px; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.12)); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), inset 0 10px 18px -12px rgba(255,255,255,0.3), inset 0 -10px 16px -10px rgba(0,0,0,0.5), 0 10px 30px -12px rgba(0,0,0,0.6); transition: all 0.35s cubic-bezier(0.2, 1.4, 0.3, 1)" style-hover="background: linear-gradient(160deg, rgba(255,255,255,0.3), rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.2)); border-color: rgba(255,255,255,0.5); transform: translateY(-2px) scale(1.04); opacity: 1" style-active="transform: translateY(0) scale(0.98)">Chapters</a>
    </div>
    <a href="Join the Club.dc.html" style="padding: 10px 22px; font-size: 14px; font-weight: 600; border-radius: 999px; color: #fff; background: linear-gradient(160deg, rgba(245,130,30,0.55), rgba(245,130,30,0.28) 45%, rgba(245,130,30,0.45)); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,175,100,0.55); box-shadow: inset 0 1px 1px rgba(255,220,180,0.5), inset 0 10px 18px -12px rgba(255,200,150,0.35), inset 0 -10px 16px -10px rgba(120,50,0,0.5), 0 10px 30px -12px rgba(245,130,30,0.45); transition: all 0.35s cubic-bezier(0.2, 1.4, 0.3, 1)" style-hover="background: linear-gradient(160deg, rgba(245,130,30,0.75), rgba(245,130,30,0.45) 45%, rgba(245,130,30,0.6)); border-color: rgba(255,200,140,0.7); transform: translateY(-2px) scale(1.04); opacity: 1" style-active="transform: translateY(0) scale(0.98)">Join the club</a>
  </nav>

  <header style="background: #000; color: #fff; display: grid; grid-template-columns: 1fr; padding-bottom: 80px; flex: 1; align-content: center">
    <div style="width: {{ heroImgWpx }}; max-width: 100%; margin: 64px auto 0; display: flex; gap: 1.6%; justify-content: center">
      <img src="assets/key-1.png" alt="Blank keycap" style="width: 24.5%; display: block; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.4, 1)" style-hover="transform: translateY(-16px) scale(1.06)">
      <img src="assets/key-2.png" alt="Terminal keycap" style="width: 24.2%; display: block; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.4, 1)" style-hover="transform: translateY(-16px) scale(1.06)">
      <img src="assets/key-3.png" alt="Blank keycap" style="width: 23.5%; display: block; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.4, 1)" style-hover="transform: translateY(-16px) scale(1.06)">
      <img src="assets/key-4.png" alt="Deploy keycap" style="width: 24.5%; display: block; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.4, 1)" style-hover="transform: translateY(-16px) scale(1.06)">
    </div>
    <div style="max-width: 1200px; width: 100%; margin: 0 auto; padding: 40px 40px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #f5821e">Members-only · Est. 2026</div>
      <h1 style="margin: 0; font-size: clamp(56px, 8vw, 110px); font-weight: 800; letter-spacing: -0.03em; line-height: 0.95; text-wrap: balance"><span style="color: #f5821e">Deploy</span> Together</h1>
      <p style="margin: 0; max-width: 560px; font-size: 19px; line-height: 1.5; color: #b3b3b3; text-wrap: pretty">A club for the people who take software the last mile. We meet, we demo, we deploy on Fridays.</p>
      <div style="display: flex; gap: 12px; margin-top: 8px">
        <a href="Join the Club.dc.html" style="padding: 15px 32px; font-size: 15px; font-weight: 700; border-radius: 999px; color: #fff; background: linear-gradient(160deg, rgba(245,130,30,0.55), rgba(245,130,30,0.28) 45%, rgba(245,130,30,0.45)); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,175,100,0.55); box-shadow: inset 0 1px 1px rgba(255,220,180,0.5), inset 0 10px 18px -12px rgba(255,200,150,0.35), inset 0 -10px 16px -10px rgba(120,50,0,0.5), 0 10px 30px -12px rgba(245,130,30,0.45); transition: all 0.35s cubic-bezier(0.2, 1.4, 0.3, 1)" style-hover="background: linear-gradient(160deg, rgba(245,130,30,0.75), rgba(245,130,30,0.45) 45%, rgba(245,130,30,0.6)); border-color: rgba(255,200,140,0.7); transform: translateY(-2px) scale(1.04); opacity: 1" style-active="transform: translateY(0) scale(0.98)">Join the club</a>
        <a href="Manifesto.dc.html" style="padding: 15px 32px; font-size: 15px; font-weight: 600; border-radius: 999px; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.12)); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), inset 0 10px 18px -12px rgba(255,255,255,0.3), inset 0 -10px 16px -10px rgba(0,0,0,0.5), 0 10px 30px -12px rgba(0,0,0,0.6); transition: all 0.35s cubic-bezier(0.2, 1.4, 0.3, 1)" style-hover="background: linear-gradient(160deg, rgba(255,255,255,0.3), rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.2)); border-color: rgba(255,255,255,0.5); transform: translateY(-2px) scale(1.04); opacity: 1" style-active="transform: translateY(0) scale(0.98)">Read the manifesto</a>
      </div>
    </div>
  </header>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;heroImageWidth&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 600, &quot;min&quot;: 400, &quot;max&quot;: 920, &quot;step&quot;: 20, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Layout&quot;}}">
class Component extends DCLogic {
  state = { email: '', joined: false };
  renderVals() {
    return {
      heroImgW: this.props.heroImageWidth ?? 600,
      heroImgWpx: (this.props.heroImageWidth ?? 600) + 'px',
      email: this.state.email,
      onEmail: (e) => this.setState({ email: e.target.value }),
      onJoin: (e) => { e.preventDefault(); this.setState({ joined: true }); },
      joinLabel: this.state.joined ? 'You\u2019re in' : 'Join',
      joinNote: this.state.joined ? '// welcome. first demo night invite is on its way.' : '// no spam. one email per release cycle.',
      stats: [
        { value: '2,400+', label: 'Members' },
        { value: '14', label: 'City chapters' },
        { value: '52', label: 'Ship Fridays a year' },
        { value: '0', label: 'Slide decks allowed' },
      ],
      pillars: [
        { num: '/01', title: 'Ship Fridays', body: 'Every Friday, members deploy something real before noon. Small is fine. Shipped is mandatory.' },
        { num: '/02', title: 'Demo nights', body: 'Monthly meetups where you show what went live — and the pipeline that got it there. Working software only.' },
        { num: '/03', title: 'Incident stories', body: 'Off-the-record postmortems from people who broke production and lived. What failed, what saved them, what changed.' },
      ],
    };
  }
}
</script>
</body>
</html>
